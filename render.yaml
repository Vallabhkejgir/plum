services:
  - type: web
    name: plum-claims-pipeline
    env: docker
    plan: free
    autoDeployTrigger: off
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      - key: TURING_API_BASE
        sync: false
      - key: TURING_API_KEY
        sync: false
      - key: TURING_API_GATEWAY_KEY
        sync: false
      - key: TURING_BASIC_AUTH
        sync: false
      - key: TURING_PROVIDER
        sync: false
      - key: TURING_UPLOAD_MODULE
        sync: false
      - key: TURING_MULTIMODAL_MODEL
        sync: false
      - key: TURING_TEXT_MODEL
        sync: false
